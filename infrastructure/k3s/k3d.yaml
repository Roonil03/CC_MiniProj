# k3d topology for local edge-cloud emulation (Design.md Sections 37-38).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dt-ram
servers: 1
agents: 2
options:
  k3s:
    extraArgs:
      - arg: --label=topology.edge/node-type=cloud --node=server:0
      - arg: --label=topology.edge/project-zone=cloud --node=server:0
      - arg: --label=topology.edge/node-type=edge --node=agent:0
      - arg: --label=topology.edge/project-zone=edge-a --node=agent:0
      - arg: --label=topology.edge/node-type=edge --node=agent:1
      - arg: --label=topology.edge/project-zone=edge-b --node=agent:1
ports:
  - port: 8080:80
    nodeFilters: [loadbalancer]
