name: dt-ram-member4

# Member-4 overlay: Python DT/Sim/RL plane alongside the Member-2 stack.
# Provides its own NATS for local notebook work; point NATS_URL at the
# member2 stack's NATS (nats://<host>:4222) to join the shared event bus.
services:
  rl-notebook:
    build:
      context: ../../services/rl-service
    environment:
      RL_SERVICE_PORT: 5001
      NATS_URL: nats://nats:4222
      PYTHONPATH: /srv/rl-service:/srv/simulation-service
    ports:
      - "5001:5001"
      - "8888:8888"
    volumes:
      - ../../services/rl-service/notebooks:/srv/rl-service/notebooks
      - ../../services/simulation-service:/srv/simulation-service:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  simulation-service:
    build:
      context: ../../services/simulation-service
    environment:
      SIMULATION_SERVICE_PORT: 5002
      NATS_URL: nats://nats:4222
    ports:
      - "5002:5002"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  safety-service:
    build:
      context: ../../services/safety-service
    environment:
      SAFETY_SERVICE_PORT: 5003
      NATS_URL: nats://nats:4222
    ports:
      - "5003:5003"
    volumes:
      - ../../services/simulation-service:/srv/simulation-service:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
