# NATS JetStream subjects (Design.md Sections 52-54).
# Sync (request/reply over HTTP) is used for API queries; async NATS for
# telemetry / decisions. State/audit events below are planned contracts.
# This is a reference file, not a NATS provisioning configuration.
subjects:
  - name: dt.telemetry.node_metric
    event: NODE_METRIC_UPDATED
    publisher: telemetry-agent
    subscriber: twin-manager
    status: implemented
    stream: DT_TELEMETRY
  - name: dt.twin.state_updated
    event: TWIN_STATE_UPDATED
    publisher: twin-manager
    subscriber: prediction-service, simulation-service
    status: planned
  - name: dt.decisions.resource
    event: RESOURCE_DECISION
    publisher: rl-service
    subscriber: infrastructure-controller
    status: implemented
    stream: DT_DECISIONS
  - name: dt.decisions.audit
    event: RESOURCE_DECISION_RESULT
    publisher: infrastructure-controller
    subscriber: experiment-service
    status: planned
streams:
  - name: DT_TELEMETRY
    max_age: 24h
    max_messages: 100000
  - name: DT_DECISIONS
    max_age: 1h
    max_messages: 10000
retention: limits
ack: explicit
