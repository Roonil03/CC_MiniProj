apiVersion: v1
kind: Namespace
metadata:
  name: dt-ram
  labels:
    app.kubernetes.io/part-of: dt-ram
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dt-ram-controller
  namespace: dt-ram
---
# Least privilege: controller may read nodes cluster-wide but may only
# write deployments/scales in dt-ram namespaces. Python/ML services get NO
# RoleBinding here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dt-ram-controller
  namespace: dt-ram
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dt-ram-controller
  namespace: dt-ram
subjects:
  - kind: ServiceAccount
    name: dt-ram-controller
    namespace: dt-ram
roleRef:
  kind: Role
  name: dt-ram-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dt-ram-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dt-ram-node-reader
subjects:
  - kind: ServiceAccount
    name: dt-ram-controller
    namespace: dt-ram
roleRef:
  kind: ClusterRole
  name: dt-ram-node-reader
  apiGroup: rbac.authorization.k8s.io
