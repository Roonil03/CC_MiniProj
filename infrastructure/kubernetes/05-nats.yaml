apiVersion: v1
kind: Service
metadata: {name: nats, namespace: dt-ram}
spec:
  selector: {app: nats}
  ports:
    - {name: client, port: 4222, targetPort: 4222}
    - {name: monitor, port: 8222, targetPort: 8222}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: nats, namespace: dt-ram}
spec:
  serviceName: nats
  replicas: 1
  selector: {matchLabels: {app: nats}}
  template:
    metadata: {labels: {app: nats}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports: [{containerPort: 4222}, {containerPort: 8222}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8222}
          livenessProbe:
            httpGet: {path: /healthz, port: 8222}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
